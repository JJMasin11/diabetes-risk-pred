name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Clone repo
      - uses: actions/setup-python@v5 # Install Python
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest # Run test suite
      - run: ruff check . --fix # Lint

      # Build Docker images and push to ACR
      - uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - run: |
          docker build -f Dockerfile.api -t ${{ secrets.ACR_LOGIN_SERVER }}/diabetes-api:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/diabetes-api:latest

          docker build -f Dockerfile.web -t ${{ secrets.ACR_LOGIN_SERVER }}/diabetes-web:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/diabetes-web:latest

      # Update FastAPI and Flask containers
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - run: |
          az containerapp update \
            --name diabetes-pred-api \
            --resource-group rg-diabetes-risk-pred \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/diabetes-api:latest

          az containerapp update \
            --name diabetes-pred-web \
            --resource-group rg-diabetes-risk-pred \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/diabetes-web:latest
