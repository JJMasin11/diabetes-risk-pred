name: Train

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Clone repo

      # Build Docker image and load to ACR
      - uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - run: |
          docker build -f Dockerfile.train -t ${{ secrets.ACR_LOGIN_SERVER }}/diabetes-train:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/diabetes-train:latest

      # Run training job and restart FastAPI container
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - run: |
          az containerapp job start --name diabetes-pred-train --resource-group rg-diabetes-risk-pred

          az containerapp update \
            --name diabetes-pred-api \
            --resource-group rg-diabetes-risk-pred \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/diabetes-api:latest
