services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=diabetes_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["seed"]

  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
      - ./mlruns:/app/mlruns
    profiles: ["train"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      - FASTAPI_URL=http://api:8000
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
